<html lang="tr">
<head>

<meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">

<style>
:root{
  --bg:#f3f5f9;--surface:#ffffff;--surface2:#eef1f6;--text:#1c2330;--muted:#7b8494;--muted-fill:#d9dee7;
  --border:#dde2ea;--accent:#2f6fed;--accent-text:#ffffff;--danger:#d64545;--warn:#e8872b;--warn-bg:#fff3e4;
  --ok:#2e9e5b;--ok-bg:#e5f6ec;--ok-ink:#fff;--prog:var(--ok);--shadow:0 2px 10px rgba(30,40,70,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b;--surface:#1b2029;--surface2:#242a36;--text:#e8ecf3;--muted:#8d97a8;--muted-fill:#363d4b;
    --border:#2c3341;--accent:#6b9bff;--accent-text:#0d1320;--danger:#ff7a7a;--warn:#f0a050;--warn-bg:#3a2b19;
    --ok:#5cd08a;--ok-bg:#16301f;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b;--surface:#1b2029;--surface2:#242a36;--text:#e8ecf3;--muted:#8d97a8;--muted-fill:#363d4b;
  --border:#2c3341;--accent:#6b9bff;--accent-text:#0d1320;--danger:#ff7a7a;--warn:#f0a050;--warn-bg:#3a2b19;
  --ok:#5cd08a;--ok-bg:#16301f;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;
}
/* renk paletleri (Faz A): data-pal=kiz|erkek; açık/koyu mod data-theme ile birlikte çalışır */
:root[data-pal="kiz"]{--bg:#F8F2FD;--surface:#FFFFFF;--surface2:#EFE6FA;--text:#3B2A5C;--muted:#6B5A8A;--muted-fill:#E3D6F3;--border:#D9C8F2;--accent:#6F4FBF;--accent-text:#FFFFFF;--ok:#B8286E;--ok-bg:#FCE4F0;--ok-ink:#FFFFFF;--prog:linear-gradient(90deg,#9B7FD6,#6F4FBF);--shadow:0 2px 10px rgba(80,50,140,.10);color-scheme:light;}
:root[data-pal="erkek"]{--bg:#EEF4FF;--surface:#FFFFFF;--surface2:#E1EBFC;--text:#0F2447;--muted:#4A5F85;--muted-fill:#D3E0F7;--border:#C9D8F3;--accent:#1F4FD8;--accent-text:#FFFFFF;--ok:#0A7480;--ok-bg:#DDF5F7;--ok-ink:#FFFFFF;--prog:linear-gradient(90deg,#3B8BEB,#1F4FD8);--shadow:0 2px 10px rgba(20,60,160,.12);color-scheme:light;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-pal="kiz"]{--bg:#1A1325;--surface:#251B35;--surface2:#30244A;--text:#F1E9FB;--muted:#B8A8D4;--muted-fill:#3E2F5A;--border:#3E2F5A;--accent:#B79CF0;--accent-text:#1A1325;--ok:#F58FBC;--ok-bg:#3A1B2E;--ok-ink:#1A1325;--prog:linear-gradient(90deg,#9B7FD6,#F4A6C8);--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;}
  :root:not([data-theme="light"])[data-pal="erkek"]{--bg:#0C1424;--surface:#14203A;--surface2:#1C2B4D;--text:#E6EEFF;--muted:#9DB0D4;--muted-fill:#263A63;--border:#263A63;--accent:#6FA2FF;--accent-text:#0A1630;--ok:#3CD3DF;--ok-bg:#0F3038;--ok-ink:#0A1630;--prog:linear-gradient(90deg,#3B8BEB,#12B5C4);--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;}
}
:root[data-theme="dark"][data-pal="kiz"]{--bg:#1A1325;--surface:#251B35;--surface2:#30244A;--text:#F1E9FB;--muted:#B8A8D4;--muted-fill:#3E2F5A;--border:#3E2F5A;--accent:#B79CF0;--accent-text:#1A1325;--ok:#F58FBC;--ok-bg:#3A1B2E;--ok-ink:#1A1325;--prog:linear-gradient(90deg,#9B7FD6,#F4A6C8);--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;}
:root[data-theme="dark"][data-pal="erkek"]{--bg:#0C1424;--surface:#14203A;--surface2:#1C2B4D;--text:#E6EEFF;--muted:#9DB0D4;--muted-fill:#263A63;--border:#263A63;--accent:#6FA2FF;--accent-text:#0A1630;--ok:#3CD3DF;--ok-bg:#0F3038;--ok-ink:#0A1630;--prog:linear-gradient(90deg,#3B8BEB,#12B5C4);--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark;}
:root[data-theme="light"][data-pal="kiz"]{--bg:#F8F2FD;--surface:#FFFFFF;--surface2:#EFE6FA;--text:#3B2A5C;--muted:#6B5A8A;--muted-fill:#E3D6F3;--border:#D9C8F2;--accent:#6F4FBF;--accent-text:#FFFFFF;--ok:#B8286E;--ok-bg:#FCE4F0;--ok-ink:#FFFFFF;--prog:linear-gradient(90deg,#9B7FD6,#6F4FBF);--shadow:0 2px 10px rgba(80,50,140,.10);color-scheme:light;}
:root[data-theme="light"][data-pal="erkek"]{--bg:#EEF4FF;--surface:#FFFFFF;--surface2:#E1EBFC;--text:#0F2447;--muted:#4A5F85;--muted-fill:#D3E0F7;--border:#C9D8F3;--accent:#1F4FD8;--accent-text:#FFFFFF;--ok:#0A7480;--ok-bg:#DDF5F7;--ok-ink:#FFFFFF;--prog:linear-gradient(90deg,#3B8BEB,#1F4FD8);--shadow:0 2px 10px rgba(20,60,160,.12);color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;min-width:0}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:20px;margin-bottom:12px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 calc(16px + var(--sar)) 24px calc(16px + var(--sal))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-top:var(--sat)}
header.top .row{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px calc(16px + var(--sar)) 8px calc(16px + var(--sal));min-height:56px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px}
.brand small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-count{background:var(--accent);color:var(--accent-text);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.icon-btn{min-width:48px;min-height:48px;border:0;background:transparent;border-radius:14px;cursor:pointer;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface2)}
main#view{padding-top:14px}
.banner{background:var(--warn-bg);color:var(--text);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-top:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card.accent{border-left:6px solid var(--accent)}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}
.big{font-size:44px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}.wrapflex{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:44px;padding:0 14px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ai-busy .ai-btn{pointer-events:none;opacity:.5}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--text);white-space:nowrap}
.badge.done{background:var(--ok-bg);color:var(--ok)}.badge.prog{background:var(--warn-bg);color:var(--warn)}
.badge.none{background:var(--surface2);color:var(--muted)}.badge.pri{background:var(--warn);color:#fff}
.badge.btnlike{cursor:pointer;min-height:32px;line-height:28px;border:1px solid var(--border)}
.bar{height:10px;background:var(--muted-fill);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .25s;background:var(--accent)}
.bar.complete>i{background:var(--ok)}
.bar.mini{height:6px}
.stripe{height:6px;border-radius:6px;margin-bottom:12px}
.chart-host{position:relative;width:100%;min-width:0}
.chart-host canvas{max-width:100%}
.pie-wrap{position:relative;width:170px;height:170px;margin:0 auto;flex:none}
.pie-wrap canvas{position:absolute;inset:0}
.pie-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;pointer-events:none;text-align:center}
.conic{position:absolute;inset:0;border-radius:50%}
.conic::after{content:"";position:absolute;inset:22%;background:var(--surface);border-radius:50%}
.pie-wrap.sm{width:110px;height:110px}.pie-wrap.sm .pie-center{font-size:16px}
.fb-bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.fb-bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-bar .tr{height:12px;background:var(--muted-fill);border-radius:6px;overflow:hidden}.fb-bar .tr i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none;padding-top:14px;padding-bottom:14px}
td.num,th.num{text-align:center}
tr.prio td{background:var(--warn-bg)}tr.prio td:first-child{border-left:4px solid var(--warn)}
td.est{font-style:italic;color:var(--muted)}
.star{color:var(--ok);font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.item .t{flex:1;min-width:140px}
.item input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.counter{display:flex;align-items:center;gap:6px}
.counter .btn{min-width:44px;padding:0}
.counter .cnt{min-width:70px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:8px}
.counter input{width:70px;min-height:40px;text-align:center}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=url],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
textarea{min-height:100px;resize:vertical}
input[type=color]{width:60px;min-height:44px;padding:2px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rowedit{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;align-items:center}
.rowedit>*{min-width:0}.rowedit .w-title{flex:1 1 180px}.rowedit .w-s{flex:0 0 84px}.rowedit .w-m{flex:1 1 140px}
.err{color:var(--danger)}.errrow{background:rgba(214,69,69,.12);border-radius:8px;padding:4px 8px;color:var(--danger)}
.preview-banner{border:2px dashed var(--accent);background:var(--surface);border-radius:14px;padding:14px;margin-bottom:12px}
/* modal */
dialog.modal{border:0;border-radius:18px;padding:0;width:min(720px,calc(100vw - 20px));max-height:92vh;max-height:92dvh;background:var(--surface);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog.modal.wide{width:min(960px,calc(100vw - 20px))}
dialog.modal::backdrop{background:rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 18px;border-bottom:1px solid var(--border)}
.modal-body{padding:16px;overflow:auto;max-height:calc(92vh - 140px);max-height:calc(92dvh - 140px)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px calc(10px + var(--sab));border-top:1px solid var(--border)}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:180px}
.menu-item{display:block;width:100%;min-height:48px;font-size:17px;text-align:left;padding:0 12px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.menu-item:hover{background:var(--surface2)}.menu-item.danger{color:var(--danger)}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:160;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:#222a38;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.3);max-width:min(520px,100%);display:flex;gap:12px;align-items:center}
.toast.error{background:#b83a3a}.toast.success{background:#23814a}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer}
#aibar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));z-index:90;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow)}
.ai-busy #aibar{display:flex}
pre.raw{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:var(--surface2);padding:10px;border-radius:8px;font-size:12px}
@media (max-width:699px){.big{font-size:38px}}
/* v2: sade, çocuk dostu arayüz */
h1{font-size:24px}
.hidden{display:none!important}
.page{max-width:820px;margin:0 auto;min-width:0}
.page.wide{max-width:1200px}
.ptitle{font-size:26px;margin:4px 0 14px}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .sub{margin:12px 0 8px;font-weight:600}
.hero h1{overflow-wrap:anywhere}
.weeknav{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.weeknav .arrow{flex:none;width:56px;min-height:56px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:28px;cursor:pointer;line-height:1}
.weeknav .wk{flex:1;min-width:0;min-height:56px;border-radius:16px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;position:relative;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.dpill{flex:0 0 68px;min-height:84px;border-radius:18px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
@media (min-width:600px){.dpill{flex:1 1 0;min-width:0}}
.dpill .dn{font-size:14px;color:var(--muted)}.dpill .dd{font-size:24px;font-weight:700;line-height:1.1}.dpill .dc{font-size:13px;color:var(--muted)}
.dpill{position:relative}.dpill .dhico{position:absolute;top:4px;right:6px;font-size:13px;line-height:1}
.dhband{border:2px dashed var(--accent);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dhband.off{border-color:var(--warn);background:var(--warn-bg)}.dhrow{display:flex;gap:10px;align-items:center;width:100%}.dhemoji{font-size:24px;line-height:1;flex:none}.dhband .dhbtn{min-height:44px}
.chip-moved{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--warn-bg);color:var(--text);border:1px solid var(--warn);margin-top:4px}
.btn.yapamadim{margin-top:8px;min-height:44px}
.fillbanner{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}.fillbanner .btn{min-height:44px}
.propcard{border:2px solid var(--accent);margin:0 0 12px}.propcard h2{margin-top:0}.propline{margin:6px 0;overflow-wrap:anywhere}.propmoved{margin:4px 0 0;padding-left:20px}.propbtns{margin-top:10px}.propbtns .btn{min-height:48px;flex:1 1 140px}
.proprow{min-width:0;overflow-wrap:anywhere;border:1px solid var(--border);border-radius:14px;padding:10px;margin:8px 0;background:var(--surface)}.propsum{font-weight:600;overflow-wrap:anywhere}.pchip{display:inline-block;max-width:100%;min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:600;padding:3px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface2)}.pchip.onaylandi{border-color:var(--ok);color:var(--ok)}.pchip.reddedildi,.pchip.eskidi,.pchip.geri{color:var(--muted)}
.propsumbox{margin:14px 0 6px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px dashed var(--border);overflow-wrap:anywhere}.itemopt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.propform textarea{min-height:64px}
.fillday{margin:14px 0 6px;font-size:16px}.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--border);border-left:8px solid var(--sc,var(--muted));border-radius:14px;padding:10px;margin-bottom:8px;background:var(--surface)}
.fillinfo{flex:1 1 200px;min-width:0}.fillbtns{display:flex;gap:8px;flex-wrap:wrap}.fillbtns .btn{min-height:44px}.vpost{font-weight:600;margin:6px 0 0}
.dhafter{font-size:14px;font-weight:600;color:var(--muted);margin:10px 2px 6px}.dhwarn{font-size:13px;color:var(--warn);font-weight:600;overflow-wrap:anywhere;margin-top:2px}
.dhnow{border:2px solid var(--accent);background:var(--surface2)}.dhnow b{overflow-wrap:anywhere}.dhgone{margin-top:0}
.dpill.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.dpill.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.dpill.sel .dn,.dpill.sel .dc{color:inherit;opacity:.9}
.dpill.full .dc{color:var(--ok);font-weight:700}.dpill.sel.full .dc{color:inherit}
.weekmenu{margin:4px 0 10px}
.daypage{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.daytitle{font-size:24px;margin:0 0 6px}
.daynote{margin-bottom:12px}
.notebtn{width:100%;min-height:48px;text-align:left;padding:0 14px;border:2px dashed var(--border);border-radius:14px;background:transparent;cursor:pointer;font-size:17px;overflow-wrap:anywhere}

  try {
    const r = await readRemote();
    if (r.missing) { setSyncStatus('err', 'Bulutta dosya yok (ya da depo bulunamadı). Öğrencinin cihazı ilk kaydı yapınca görünecek.'); return; }

}

async function photoToB64(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new AiError('Bu fotoğrafı açamadım. Başka bir fotoğraf dene.')); img.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);

}

function init() {
  state = loadState();

  setInterval(dhTick, 20000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') dhTick(); });

  window.addEventListener('hashchange', () => rerender(false));
  $('#btn-settings').addEventListener('click', () => navigate('#ayarlar'));
  $('#ai-cancel').addEventListener('click', () => { aiRun.ctrl && aiRun.ctrl.abort(); });
  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { state = migrateState(JSON.parse(e.newValue)); rerender(true); } catch (err) { /* yoksay */ } } });
  const flush = () => { try { saveState.flush(); } catch (e) { /* yoksay */ } };
  window.addEventListener('beforeunload', flush); window.addEventListener('pagehide', flush);
  let lastCur = weekStartKey(new Date());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flush(); return; }
    const cur = weekStartKey(new Date());
    if (cur !== lastCur) { if (ui.programWeek === lastCur) { ui.programWeek = cur; ui.selDay = todayIdx(); ui.preview = null; } lastCur = cur; rerender(true); }
  });
  if (!document.querySelector('link[rel=manifest]') && /^https?:$/.test(location.protocol)) document.head.appendChild(el('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (parseRoute().name === 'ayarlar') rerender(true); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; showToast('Uygulama yüklendi', 'success'); });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => rerender(true)); } catch (e) { /* yoksay */ }
  rerender(false);
  syncStart();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
